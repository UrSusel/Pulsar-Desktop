<!DOCTYPE html>
<html lang="pl" data-mode="overlay" data-style="card" data-pos="bl" data-viz="1">
<head>
<meta charset="utf-8">
<title>Pulsar → OBS</title>
<!--
  Pulsar → OBS
  Źródło „Przeglądarka” w OBS (zaznacz „Plik lokalny” i „Steruj dźwiękiem przez OBS”).
  Strona łączy się z działającym Pulsarem (lokalny serwer Neutralino, tylko 127.0.0.1),
  odbiera dźwięk (PCM 16-bit, bez kompresji) i metadane, a OBS przechwytuje ten dźwięk natywnie.
  Plik generuje Pulsar przy włączeniu „Połączenia z OBS” — nie edytuj go ręcznie.
  Strona dostaje wyłącznie „connect token”: może odbierać zdarzenia, ale nie wywoła żadnych funkcji systemowych.
-->
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; color: #fff; --acc: 160, 107, 255; }
  html[data-mode="audio"] .card { display: none !important; }
  .card {
    position: absolute; left: 24px; bottom: 24px; width: min(720px, calc(100vw - 48px));
    display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center;
    padding: 16px 20px 16px 16px; border-radius: 20px; box-sizing: border-box;
    background: linear-gradient(135deg, rgba(12, 12, 20, .82), rgba(12, 12, 20, .64));
    border: 1px solid rgba(var(--acc), .45);
    box-shadow: 0 18px 50px rgba(0, 0, 0, .45), 0 0 40px rgba(var(--acc), .18) inset;
    --tx: 0px; --ty: 14px;
    opacity: 0; transform: translate(var(--tx), var(--ty)); transition: opacity .6s ease, transform .6s ease, border-color .8s ease;
  }
  .card.show { opacity: 1; transform: translate(var(--tx), 0); }
  .card.idle { opacity: .0; transform: translate(var(--tx), var(--ty)); }
  .cover { width: 112px; height: 112px; border-radius: 14px; object-fit: cover; background: #151520; box-shadow: 0 10px 30px rgba(0, 0, 0, .5); }
  .cover:not([src]) { background: radial-gradient(circle at 30% 25%, rgba(var(--acc), .85), rgba(var(--acc), .15) 70%), #151520; }
  .meta { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .np { font-size: 12px; letter-spacing: 1.6px; text-transform: uppercase; color: rgba(var(--acc), 1); font-weight: 700; filter: brightness(1.35); }
  .title { font-size: 26px; font-weight: 800; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 2px 10px rgba(0, 0, 0, .5); }
  .artist { font-size: 17px; color: rgba(255, 255, 255, .72); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row { display: flex; align-items: center; gap: 12px; margin-top: 6px; }
  .bar { flex: 1; height: 5px; border-radius: 99px; background: rgba(255, 255, 255, .16); overflow: hidden; }
  .fill { height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, rgba(var(--acc), 1), rgba(var(--acc), .6)); box-shadow: 0 0 12px rgba(var(--acc), .8); }
  .time { font-size: 13px; color: rgba(255, 255, 255, .6); font-variant-numeric: tabular-nums; white-space: nowrap; }
  canvas.viz { position: absolute; left: 146px; right: 0; bottom: 0; width: calc(100% - 146px); height: 34px; opacity: .55; pointer-events: none; border-radius: 0 0 20px 0; }

  /* ---------- pozycja (Pulsar → Ustawienia → OBS → Wygląd overlayu) ---------- */
  html[data-pos="br"] .card { left: auto; right: 24px; }
  html[data-pos="tl"] .card { bottom: auto; top: 24px; --ty: -14px; }
  html[data-pos="tr"] .card { bottom: auto; top: 24px; left: auto; right: 24px; --ty: -14px; }
  html[data-pos="bc"] .card { left: 50%; --tx: -50%; }
  html[data-viz="0"] canvas.viz { display: none; }

  /* ---------- motyw: pasek na całą szerokość ---------- */
  html[data-style="bar"] .card {
    left: 0; right: 0; bottom: 0; top: auto; width: 100%; --tx: 0px; --ty: 100%;
    grid-template-columns: auto 1fr; gap: 14px; padding: 10px 150px 13px 12px; border-radius: 0;
    border-width: 1px 0 0; background: linear-gradient(90deg, rgba(12, 12, 20, .9), rgba(12, 12, 20, .72));
    box-shadow: 0 -8px 30px rgba(0, 0, 0, .35);
  }
  html[data-style="bar"][data-pos^="t"] .card { top: 0; bottom: auto; border-width: 0 0 1px; --ty: -100%; }
  html[data-style="bar"] .cover { width: 54px; height: 54px; border-radius: 8px; }
  html[data-style="bar"] .meta { flex-direction: row; align-items: baseline; gap: 12px; }
  html[data-style="bar"] .np { flex: none; font-size: 11px; }
  html[data-style="bar"] .title { font-size: 21px; flex: 0 1 auto; max-width: 62%; }
  html[data-style="bar"] .artist { font-size: 16px; flex: 0 1000 auto; }
  html[data-style="bar"] .artist:not(:empty)::before { content: "— "; color: rgba(255, 255, 255, .4); }
  html[data-style="bar"] .row { position: absolute; left: 0; right: 0; bottom: 0; margin: 0; }
  html[data-style="bar"] .bar { height: 3px; border-radius: 0; background: rgba(255, 255, 255, .08); }
  html[data-style="bar"] .fill { border-radius: 0; }
  html[data-style="bar"] .time { position: absolute; right: 16px; bottom: 26px; font-size: 14px; }
  html[data-style="bar"] canvas.viz { left: auto; right: 0; width: 42%; height: 100%; opacity: .28; border-radius: 0; }

  /* ---------- motyw: duża okładka z napisem ---------- */
  html[data-style="cover"] .card { display: block; width: 300px; padding: 0; border-radius: 18px; overflow: hidden; }
  html[data-style="cover"] .cover { display: block; width: 100%; height: 300px; border-radius: 0; box-shadow: none; }
  html[data-style="cover"] .meta {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; gap: 2px;
    padding: 56px 16px 14px; background: linear-gradient(transparent, rgba(0, 0, 0, .55) 35%, rgba(0, 0, 0, .9));
  }
  html[data-style="cover"] .np { font-size: 10px; }
  html[data-style="cover"] .title { font-size: 20px; }
  html[data-style="cover"] .artist { font-size: 14px; }
  html[data-style="cover"] .bar { height: 4px; }
  html[data-style="cover"] .time { font-size: 12px; }
  html[data-style="cover"] canvas.viz { left: 0; right: 0; top: 0; bottom: auto; width: 100%; height: 46px; z-index: 1; opacity: .5; transform: scaleY(-1); border-radius: 0; }

  /* ---------- motyw: minimalny (sam tekst) ---------- */
  html[data-style="minimal"] .card { width: auto; max-width: calc(100vw - 48px); background: none; border: 0; box-shadow: none; padding: 0; gap: 14px; }
  html[data-style="minimal"] .cover { width: 64px; height: 64px; border-radius: 10px; }
  html[data-style="minimal"] .np, html[data-style="minimal"] .time, html[data-style="minimal"] canvas.viz { display: none; }
  html[data-style="minimal"] .title { font-size: 26px; text-shadow: 0 2px 8px rgba(0, 0, 0, .85), 0 0 2px rgba(0, 0, 0, .9); }
  html[data-style="minimal"] .artist { font-size: 17px; color: rgba(255, 255, 255, .85); text-shadow: 0 2px 6px rgba(0, 0, 0, .85); }
  html[data-style="minimal"] .row { margin-top: 4px; }
  html[data-style="minimal"] .bar { height: 3px; background: rgba(255, 255, 255, .22); }
</style>
</head>
<body>
  <div class="card" id="card">
    <img class="cover" id="cover" alt="">
    <div class="meta">
      <div class="np" id="np">Teraz gra</div>
      <div class="title" id="title"></div>
      <div class="artist" id="artist"></div>
      <div class="row"><div class="bar"><div class="fill" id="fill"></div></div><div class="time" id="time"></div></div>
    </div>
    <canvas class="viz" id="viz"></canvas>
  </div>
<script>
(function () {
  'use strict';
  var MODE = document.documentElement.getAttribute('data-mode') || 'overlay';
  var PREVIEW = /[?&]preview\b/.test(location.search); // podgląd w ustawieniach Pulsara — dane przez postMessage, bez połączenia
  var themeAccent = ''; // własny kolor akcentu z motywu ('' = z okładki)
  var TARGET = 0.12;   // docelowy bufor [s] — małe opóźnienie względem Pulsara
  var MAX_LEAD = 0.3;  // powyżej tego nadmiarowe paczki są odrzucane
  var ctx = null, outGain = null, analyser = null, nextTime = 0, lastSeq = -1, lastAudioAt = 0;
  var ws = null, retryTimer = 0, connectedAt = 0, lastNow = -1, lastArrive = 0;
  var meta = { playing: false, pos: 0, dur: 0, at: 0 };
  var $ = function (id) { return document.getElementById(id); };
  var LABELS = { pl: 'Teraz gra', en: 'Now playing', es: 'Sonando ahora' };

  window.__pulsarObs = { stats: { chunks: 0, dropped: 0, resets: 0, lead: 0 }, meta: meta, connected: false };
  var stats = window.__pulsarObs.stats;

  /* ---------- połączenie z Pulsarem ---------- */
  function loadConnection(cb) {
    // connection.js jest nadpisywany przy każdym starcie Pulsara (nowy token) — wczytujemy go na świeżo
    var old = document.getElementById('pulsarConn');
    if (old) old.parentNode.removeChild(old);
    var s = document.createElement('script');
    s.id = 'pulsarConn';
    s.src = 'connection.js?t=' + Date.now();
    s.onload = function () { cb(window.PULSAR_OBS || null); };
    s.onerror = function () { cb(null); };
    document.head.appendChild(s);
  }
  function scheduleRetry(ms) {
    clearTimeout(retryTimer);
    retryTimer = setTimeout(connect, ms || 2000);
  }
  function connect() {
    loadConnection(function (c) {
      if (!c || !c.port || !c.connectToken) { scheduleRetry(2000); return; }
      try {
        ws = new WebSocket('ws://127.0.0.1:' + c.port + '/?connectToken=' + encodeURIComponent(c.connectToken));
      } catch (e) { scheduleRetry(2000); return; }
      ws.onopen = function () { connectedAt = Date.now(); window.__pulsarObs.connected = true; };
      ws.onclose = function () { window.__pulsarObs.connected = false; ws = null; scheduleRetry(1500); };
      ws.onerror = function () { try { ws.close(); } catch (e) {} };
      ws.onmessage = function (ev) {
        var msg;
        if (typeof ev.data !== 'string' || ev.data.indexOf('"pulsarObs') < 0) return; // ignoruj inne zdarzenia Neutralino
        try { msg = JSON.parse(ev.data); } catch (e) { return; }
        if (!msg || !msg.event) return;
        if (msg.event === 'pulsarObsAudio') onAudio(msg.data);
        else if (msg.event === 'pulsarObsMeta') onMeta(msg.data);
        else if (msg.event === 'pulsarObsCover') onCover(msg.data);
      };
    });
  }

  /* ---------- dźwięk ---------- */
  function ensureCtx(sr) {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    var AC = window.AudioContext || window.webkitAudioContext;
    try { ctx = new AC({ latencyHint: 'playback', sampleRate: sr }); } catch (e) { ctx = new AC(); }
    outGain = ctx.createGain();
    analyser = ctx.createAnalyser(); analyser.fftSize = 256; analyser.smoothingTimeConstant = 0.75;
    outGain.connect(analyser); analyser.connect(ctx.destination);
  }
  function b64ToInt16(b64) {
    var bin = atob(b64), n = bin.length, u8 = new Uint8Array(n);
    for (var i = 0; i < n; i++) u8[i] = bin.charCodeAt(i);
    return new Int16Array(u8.buffer, 0, n >> 1);
  }
  function onAudio(d) {
    if (!d || !d.pcm) return;
    var sr = d.sr || 48000, ch = d.ch || 2;
    ensureCtx(sr);
    var pcm = b64ToInt16(d.pcm), frames = (pcm.length / ch) | 0;
    if (!frames) return;
    var buf = ctx.createBuffer(ch, frames, sr);
    for (var c = 0; c < ch; c++) {
      var out = buf.getChannelData(c);
      for (var i = 0, j = c; i < frames; i++, j += ch) out[i] = pcm[j] / 32768;
    }
    if (ctx.state !== 'running') return; // kontekst jeszcze startuje — zegar stoi, nie ma sensu kolejkować
    var now = ctx.currentTime, tNow = performance.now();
    // zegar audio stoi mimo stanu „running” (urządzenie jeszcze się otwiera) → nie kolejkuj, bo bufor tylko by puchł
    var stalled = now === lastNow && tNow - lastArrive > 25;
    lastArrive = tNow;
    if (stalled) { stats.stalled = (stats.stalled || 0) + 1; lastSeq = -1; return; }
    lastNow = now;
    // przerwa w dostawie (pauza, zmiana utworu) lub start → ustaw bufor od nowa
    if (lastSeq < 0 || d.seq !== lastSeq + 1 || nextTime < now + 0.02) { nextTime = now + TARGET; if (lastSeq >= 0) stats.resets++; }
    lastSeq = d.seq;
    var lead = nextTime - now;
    // za duży zapas (seria zaległych paczek po chwilowym zablokowaniu strony) → odrzuć nadmiar, żeby nie rosło opóźnienie
    if (lead > MAX_LEAD) { stats.dropped++; return; }
    // łagodna korekta dryfu zegarów (maks. ±0,5% ≈ 9 centów — niesłyszalne), zamiast skoków
    var rate = 1 + Math.max(-0.005, Math.min(0.005, (lead - TARGET) * 0.05));
    var src = ctx.createBufferSource();
    src.buffer = buf; src.playbackRate.value = rate;
    src.connect(outGain);
    src.start(nextTime);
    nextTime += buf.duration / rate;
    stats.chunks++; stats.lead = Math.round(lead * 1000); stats.state = ctx.state; stats.ctxTime = Math.round(now * 1000);
    lastAudioAt = Date.now();
  }

  /* ---------- metadane / overlay ---------- */
  function fmt(s) { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }
  function onMeta(m) {
    if (!m) return;
    meta.playing = !!m.playing; meta.pos = +m.pos || 0; meta.dur = +m.dur || 0; meta.at = performance.now();
    if (m.lang && LABELS[m.lang]) $('np').textContent = LABELS[m.lang];
    if (m.title != null && $('title').textContent !== m.title) $('title').textContent = m.title;
    if (m.artist != null && $('artist').textContent !== m.artist) $('artist').textContent = m.artist;
    if (m.theme) applyTheme(m.theme);
    var acc = themeAccent || m.accent;
    if (acc) document.body.style.setProperty('--acc', acc);
    if (!m.coverId) { $('cover').removeAttribute('src'); $('cover').dataset.id = ''; }
    var card = $('card');
    if (m.title) card.classList.add('show');
    card.classList.toggle('idle', !m.hasTrack || m.hidden === true);
  }
  function applyTheme(th) {
    var root = document.documentElement;
    var st = { card: 1, bar: 1, cover: 1, minimal: 1 }[th.style] ? th.style : 'card';
    var ps = { bl: 1, br: 1, tl: 1, tr: 1, bc: 1 }[th.pos] ? th.pos : 'bl';
    if (root.getAttribute('data-style') !== st) root.setAttribute('data-style', st);
    if (root.getAttribute('data-pos') !== ps) root.setAttribute('data-pos', ps);
    root.setAttribute('data-viz', th.viz === false ? '0' : '1');
    themeAccent = /^\d{1,3}, ?\d{1,3}, ?\d{1,3}$/.test(String(th.accent || '')) ? th.accent : '';
  }
  function onCover(c) {
    if (!c) return;
    var img = $('cover');
    if (img.dataset.id === c.id) return;
    img.dataset.id = c.id || '';
    if (c.data) img.src = c.data; else img.removeAttribute('src');
  }
  function tick() {
    requestAnimationFrame(tick);
    if (MODE !== 'overlay') return;
    var pos = meta.pos + (meta.playing ? (performance.now() - meta.at) / 1000 : 0);
    if (meta.dur) pos = Math.min(pos, meta.dur);
    $('fill').style.width = (meta.dur ? (pos / meta.dur) * 100 : 0) + '%';
    $('time').textContent = meta.dur ? fmt(pos) + ' / ' + fmt(meta.dur) : '';
    drawViz();
  }
  var vizData = null;
  function drawViz() {
    var cv = $('viz'); if (!cv) return;
    var w = cv.clientWidth, h = cv.clientHeight;
    if (!w || !h) return;
    var dpr = window.devicePixelRatio || 1;
    if (cv.width !== (w * dpr | 0)) { cv.width = w * dpr | 0; cv.height = h * dpr | 0; }
    var g = cv.getContext('2d');
    g.clearRect(0, 0, cv.width, cv.height);
    if (!analyser || Date.now() - lastAudioAt > 400) return;
    if (!vizData) vizData = new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteFrequencyData(vizData);
    var acc = getComputedStyle(document.body).getPropertyValue('--acc').trim() || '160,107,255';
    g.fillStyle = 'rgba(' + acc + ',0.9)';
    var bars = 48, bw = cv.width / bars;
    for (var i = 0; i < bars; i++) {
      var v = vizData[Math.min(vizData.length - 1, Math.floor(Math.pow(i / bars, 1.6) * vizData.length * 0.9))] / 255;
      var bh = Math.max(1, v * v * cv.height);
      g.fillRect(i * bw + 1, cv.height - bh, bw - 2, bh);
    }
  }

  // OBS pozwala na autoodtwarzanie; w zwykłej przeglądarce kontekst audio ruszy po kliknięciu
  document.addEventListener('click', function () { if (ctx && ctx.state === 'suspended') ctx.resume(); });
  requestAnimationFrame(tick);
  if (PREVIEW) {
    // tło „przezroczystości” rysuje sam podgląd (ramka w oknie Pulsara nie zawsze jest przezroczysta)
    document.documentElement.style.background = 'repeating-conic-gradient(#2a2a30 0 25%, #1e1e24 0 50%) 0 0 / 40px 40px';
    // podgląd: dane z okna Pulsara; sztuczny analizator nie jest potrzebny — rysujemy „udawane” słupki
    window.addEventListener('message', function (ev) {
      var d = ev.data || {};
      if (d.pulsarObsPreview) { onMeta(d.pulsarObsPreview); if (d.cover !== undefined) onCover({ id: 'p' + (d.cover || '').length + (d.cover || '').slice(-24), data: d.cover }); }
    });
    analyser = { frequencyBinCount: 128, getByteFrequencyData: function (a) { var t = performance.now() / 1000; for (var i = 0; i < a.length; i++) a[i] = 150 + 90 * Math.sin(t * 3 + i * 0.35) * Math.cos(t * 1.3 + i * 0.11); } };
    setInterval(function () { lastAudioAt = Date.now(); }, 200);
    try { parent.postMessage({ pulsarObsPreviewReady: true }, '*'); } catch (e) {}
  } else connect();
})();
</script>
</body>
</html>
